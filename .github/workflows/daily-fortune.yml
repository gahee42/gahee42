name: Bake daily fortune cookies

on:
  schedule:
    # 00:17 UTC = 09:17 KST. GitHub may start scheduled runs later.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fortune-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    # Only update the default branch, including manually triggered runs.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile repository
        # actions/checkout v4.2.2, pinned to the release commit.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Test the cookie baker
        run: python3 -m unittest discover -s tests -v

      - name: Bake today's cookies
        env:
          FORTUNE_NAMESPACE: ${{ github.repository_owner }}
        run: python3 scripts/update_fortunes.py --namespace "$FORTUNE_NAMESPACE"

      - name: Commit only the generated README change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "Today's cookies are already ready."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'chore: refresh daily fortune cookies'
          # A concurrent human push causes a safe failure, never a force push.
          git push origin "HEAD:${GITHUB_REF_NAME}"
